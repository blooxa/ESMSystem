services:
  - type: web
    name: esm-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn esm_backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com

databases:
  - name: esm-db
    databaseName: esm
    user: esm